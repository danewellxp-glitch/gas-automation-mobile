<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <title>Gas Driver</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Debug: mostra erros JS na tela em vez de tela branca
      window.onerror = function(msg, url, line, col, err) {
        var d = document.getElementById('root');
        d.innerHTML = '<div style="padding:20px;font-family:monospace;color:red;word-break:break-all">' +
          '<h2>JS Error</h2><p>' + msg + '</p><p>File: ' + url + ':' + line + ':' + col + '</p>' +
          (err && err.stack ? '<pre>' + err.stack + '</pre>' : '') + '</div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('root');
        d.innerHTML = '<div style="padding:20px;font-family:monospace;color:red;word-break:break-all">' +
          '<h2>Promise Error</h2><p>' + (e.reason ? (e.reason.message || e.reason) : 'Unknown') + '</p>' +
          (e.reason && e.reason.stack ? '<pre>' + e.reason.stack + '</pre>' : '') + '</div>';
      });
    </script>
  </body>
</html>
